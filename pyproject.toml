[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nlip-receipts"
version = "0.1.0"
description = "NLIP Type-3 Security Extension for Execution-Attested Side-Effect Gating (ECMA-430 / ECMA-434)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "CIRWEL"}
]
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["nlip_receipts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
