name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-eval-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bubblewrap (verify sandbox)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bwrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all --die-with-parent -- /bin/true

      - name: Install dependencies and nlip-project packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydantic fastapi uvicorn httpx pytest python-multipart \
            "nlip_sdk @ git+https://github.com/nlip-project/nlip_sdk.git" \
            "nlip-server @ git+https://github.com/nlip-project/nlip_server.git"
          python -m pip install -e .

      - name: Run pytest suite
        run: pytest -v

      - name: Run decision-function ablation
        run: python eval/benchmark.py

      - name: Run end-to-end attack suite (NLIP round trip, sandboxed verify, git push)
        run: python eval/e2e_attacks.py

      - name: Run 7-step end-to-end NLIP Type-3 demo
        run: python demo.py
