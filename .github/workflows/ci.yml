name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-eval-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and nlip-project packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydantic fastapi uvicorn httpx pytest python-multipart \
            "nlip_sdk @ git+https://github.com/nlip-project/nlip_sdk.git" \
            "nlip-server @ git+https://github.com/nlip-project/nlip_server.git"
          python -m pip install -e .

      - name: Run 11-suite pytest verification
        run: pytest -v

      - name: Run 2,080-trial reproducible evaluation & ablation benchmark
        run: python eval/benchmark.py

      - name: Run 7-step end-to-end NLIP Type-3 demo
        run: python demo.py
